    fries: '<svg viewBox="0 0 80 80" aria-hidden="true"><path class="liq" d="M22 38h36l-5 32H27z"/><path d="M28 38l-4-24 6-1 3 25M36 38V10h6v28M46 38l3-24 6 1-3 23M20 36h40l-6 36H26z"/></svg>'
  };

  var TAGS = Object.assign({
    top: '🔥 Más pedido', spicy: '🌶️ Picante', 'new': 'Nuevo', share: 'Para compartir', veg: '🌱 Vegetariano', house: '★ De la casa', cold: '❄️ Heladita'
  }, C.tagLabels || {});

  /* ---------- Índice de platos ---------- */
  var ITEMS = {};
  var num = 0;
  C.categories.forEach(function (c) {
    c.items.forEach(function (it) { it.cat = c.id; it.n = ++num; ITEMS[it.id] = it; });
  });

  var cart = store.get(KEY_CART, {});

  /* ---------- Horario (hora de Lima) ---------- */
  var toMin = function (s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); };
  function intervals(day) {
    return (C.hours[day] || []).map(function (r) { var a = toMin(r[0]), b = toMin(r[1]); if (b <= a) b += 1440; return [a, b]; });
  }
  function limaNow() {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Lima', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    var g = function (t) { for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value; return '0'; };
    var h = +g('hour'); if (h === 24) h = 0;
    return { wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')), min: h * 60 + (+g('minute')) };
  }
  function hhmm(m) {
    m = m % 1440; var h = Math.floor(m / 60), mm = m % 60;
    var suf = h < 12 ? 'a. m.' : 'p. m.';
    var h12 = h % 12 || 12;
    return h12 + ':' + (mm < 10 ? '0' : '') + mm + ' ' + suf;
  }
  var DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  function status() {
    var n = limaNow();
    var today = intervals(n.wd), i, iv;
    for (i = 0; i < today.length; i++) { iv = today[i]; if (n.min >= iv[0] && n.min < iv[1]) return { open: true, text: 'Cierra a las ' + hhmm(iv[1]) }; }
    var yest = intervals((n.wd + 6) % 7);
    for (i = 0; i < yest.length; i++) { iv = yest[i]; if (n.min + 1440 >= iv[0] && n.min + 1440 < iv[1]) return { open: true, text: 'Cierra a las ' + hhmm(iv[1]) }; }
    for (var d = 0; d < 8; d++) {
      var list = intervals((n.wd + d) % 7);
      for (i = 0; i < list.length; i++) {
        if (d > 0 || list[i][0] > n.min) {
          var when = d === 0 ? 'hoy' : d === 1 ? 'mañana' : 'el ' + DAYS[(n.wd + d) % 7];
          return { open: false, text: 'Abre ' + when + ' a las ' + hhmm(list[i][0]) };
        }
      }
    }
    return { open: false, text: '' };
  }

  function todayHours() {
    var list = intervals(limaNow().wd);
    if (!list.length) return 'Cerrado';
    return list.map(function (iv) { return hhmm(iv[0]).replace(':00', '') + ' – ' + (iv[1] % 1440 === 0 ? '12 medianoche' : hhmm(iv[1]).replace(':00', '')); }).join(' / ');
  }

  /* ---------- Plantillas ---------- */

        '<div class="cat__list cat__list--' + (c.layout || C.layout) + '">' + c.items.map(function (it) { return dishHTML(it, c.layout || C.layout); }).join('') + '</div></section>';

    html += '</main>';
    html += '<footer class="foot">' + (C.footDeco || '') +
      '<p class="foot__name">' + esc(C.name) + '</p>' +
      '<p class="foot__addr">' + ICON.pin + '<span>' + esc(C.address) + '</span></p>' +
      '<p class="foot__hours">' + ICON.clock + '<span>' + C.hoursLabel.split(' · ').map(nb).join('<br>') + '</span></p>' +
      '<p class="foot__hours">' + ICON.moto + '<span>Delivery ' + esc(C.delivery) + '</span></p>' +
      '<p class="foot__wa"><a href="https://wa.me/' + WA_NUMBER + '" target="_blank" rel="noopener">' + ICON.wa + '<span>+51 900 000 000</span></a></p>' +
      '<p class="foot__small">Precios en soles, incluyen IGV. Fotos referenciales.</p>' +
      '<p class="credit">Menú de muestra · Diseñado por Clickea Studio</p></footer>';

    html += '<div class="cartbar" id="cartbar" hidden><button type="button" id="openCart" aria-haspopup="dialog">' +
      '<span class="cartbar__count" id="barCount">0</span><span class="cartbar__label">Ver mi pedido</span><span class="cartbar__total" id="barTotal">S/ 0.00</span></button></div>';
    html += '<div class="toast" id="toast" role="status" aria-live="polite"></div>';

    html += '<dialog class="sheet" id="sheet" aria-labelledby="sheetT"><div class="sheet__in">' +
      '<div class="sheet__grab" aria-hidden="true"></div>' +
      '<header class="sheet__head"><h2 id="sheetT">Tu pedido</h2><button type="button" class="icon-btn" data-close aria-label="Cerrar pedido">' + ICON.close + '</button></header>' +
      '<p class="sheet__closed" id="closedNote" hidden></p>' +
      '<ul class="lines" id="lines"></ul>' +
      '<div class="sum"><span>Total de productos</span><strong id="sumTotal">S/ 0.00</strong></div>' +
      '<p class="sum__note" id="sumNote"></p>' +
      '<form class="form" id="orderForm" novalidate>' +
        '<h3 class="form__t">Tus datos</h3>' +
        '<label class="field"><span>Nombre</span><input id="fName" name="nombre" autocomplete="name" required placeholder="¿A nombre de quién?"><em class="err" id="eName">Escribe tu nombre, por fa.</em></label>' +
        '<fieldset class="seg"><legend>¿Cómo lo recibes?</legend><div class="seg__opts">' +
          '<label><input type="radio" name="modo" value="delivery" checked><span>' + ICON.moto + 'Delivery</span></label>' +
          '<label><input type="radio" name="modo" value="recojo"><span>' + ICON.bag + 'Recojo</span></label></div></fieldset>' +
        '<label class="field" id="addrField"><span>Dirección y referencia</span><textarea id="fAddr" name="direccion" rows="2" autocomplete="street-address" placeholder="Ej.: Jr. Los Pinos 245, dpto. 302 — frente al parque"></textarea><em class="err" id="eAddr">Necesitamos tu dirección para el delivery.</em></label>' +
        '<fieldset class="seg"><legend>Método de pago</legend><div class="seg__opts seg__opts--3">' +
          '<label><input type="radio" name="pago" value="Yape" checked><span>Yape</span></label>' +
          '<label><input type="radio" name="pago" value="Plin"><span>Plin</span></label>' +

      '<button type="button" class="link-btn" id="clearCart">Vaciar pedido</button>' +
      '<div class="sheet__cta"><a class="wa-btn" id="waBtn" href="https://wa.me/' + WA_NUMBER + '" target="_blank" rel="noopener">' + ICON.wa + '<span>Pedir por WhatsApp</span><b id="waTotal">S/ 0.00</b></a></div>' +
      '</div></dialog>';
    root.innerHTML = html;
  }

  /* ---------- Carrito ---------- */
  function lines() {
    return Object.keys(cart).map(function (id) { return { it: ITEMS[id], q: cart[id] }; })
      .sort(function (a, b) { return a.it.n - b.it.n; });
  }
  function total() { return lines().reduce(function (s, l) { return s + l.it.price * l.q; }, 0); }
  function count() { return lines().reduce(function (s, l) { return s + l.q; }, 0); }

  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function setQty(id, q) {
    if (q > 0) cart[id] = Math.min(q, 50); else delete cart[id];
    store.set(KEY_CART, cart);
    $$('[data-ctl="' + id + '"]').forEach(function (el) { el.innerHTML = ctlHTML(id); });
    refresh();
  }
  function refresh() {
    var c = count(), t = total();
    var bar = $('#cartbar');
    var wasHidden = bar.hidden;
    bar.hidden = c === 0;
    document.body.classList.toggle('has-cart', c > 0);
    if (wasHidden && c > 0) { bar.classList.remove('pop'); void bar.offsetWidth; bar.classList.add('pop'); }
    $('#barCount').textContent = c;
    $('#barTotal').textContent = fmt(t);
    $('#openCart').setAttribute('aria-label', 'Ver mi pedido: ' + c + (c === 1 ? ' producto' : ' productos') + ', total ' + fmt(t));
    renderSheet();
  }
  function renderSheet() {
    var ls = lines();
    $('#lines').innerHTML = ls.length ? ls.map(function (l) {
      return '<li class="line"><div class="line__info"><strong>' + esc(l.it.name) + '</strong><span>' + fmt(l.it.price) + ' c/u</span></div>' +
        '<span class="ctl" data-ctl="' + l.it.id + '">' + ctlHTML(l.it.id) + '</span>' +
        '<span class="line__sub">' + fmt(l.it.price * l.q) + '</span></li>';
    }).join('') : '<li class="line line--empty">Tu pedido está vacío. ¡Agrega algo rico!</li>';
    $('#sumTotal').textContent = fmt(total());
    $('#waTotal').textContent = fmt(total());
    updateWA();
  }

  /* ---------- Formulario y WhatsApp ---------- */
  function formData() {
    var modo = ($('input[name="modo"]:checked') || {}).value || 'delivery';
    var pago = ($('input[name="pago"]:checked') || {}).value || 'Yape';
    return {
      nombre: $('#fName').value.trim(), modo: modo, direccion: $('#fAddr').value.trim(),
      pago: pago, efectivo: $('#fCash').value.trim(), nota: $('#fNote').value.trim()
    };
  }
  function waText() {
    var f = formData(), L = [];
    L.push('*Nuevo pedido · ' + C.name + '*');
    L.push('');
    lines().forEach(function (l) { L.push('• ' + l.q + ' × ' + l.it.name + ' — ' + fmt(l.it.price * l.q)); });
    L.push('');
    L.push('*Total productos: ' + fmt(total()) + '*');
    if (f.modo === 'delivery') L.push('_(+ delivery según zona: ' + C.deliveryFee + ')_');
    L.push('');
    L.push('👤 Nombre: ' + (f.nombre || '—'));
    L.push((f.modo === 'delivery' ? '🛵 Entrega: Delivery' : '🛍️ Entrega: Recojo en local'));
    if (f.modo === 'delivery') L.push('📍 Dirección: ' + (f.direccion || '—'));
    L.push('💳 Pago: ' + f.pago + (f.pago === 'Efectivo' && f.efectivo ? ' (pago con S/ ' + f.efectivo.replace(/^s\/\s*/i, '') + ')' : ''));
    if (f.nota) L.push('📝 Nota: ' + f.nota);
    return L.join('\n');
  }
  function updateWA() {
    var f = formData();
    $('#addrField').hidden = f.modo !== 'delivery';
    $('#cashField').hidden = f.pago !== 'Efectivo';
    $('#sumNote').textContent = f.modo === 'delivery' ? 'Delivery: ' + C.deliveryFee + '. Se confirma por WhatsApp.' : 'Recojo en ' + C.address + '.';
    $('#waBtn').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waText());
    store.set(KEY_FORM, f);
  }
  function validate() {
    var f = formData(), ok = true, first = null;
    var nameBad = !f.nombre, addrBad = f.modo === 'delivery' && f.direccion.length < 5;
    $('#fName').closest('.field').classList.toggle('bad', nameBad);
    $('#fAddr').closest('.field').classList.toggle('bad', addrBad);
    $('#fName').setAttribute('aria-invalid', nameBad);
    $('#fAddr').setAttribute('aria-invalid', addrBad);
    if (nameBad) { ok = false; first = $('#fName'); }
    if (addrBad) { ok = false; first = first || $('#fAddr'); }
    if (!lines().length) ok = false;
    if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: behavior() }); }
    return ok;
  }
  function restoreForm() {
    var f = store.get(KEY_FORM, null); if (!f) return;
    $('#fName').value = f.nombre || ''; $('#fAddr').value = f.direccion || '';
    $('#fCash').value = f.efectivo || ''; $('#fNote').value = f.nota || '';
    var m = $('input[name="modo"][value="' + f.modo + '"]'); if (m) m.checked = true;
    var p = $('input[name="pago"][value="' + f.pago + '"]'); if (p) p.checked = true;
  }

  /* ---------- Hoja del pedido ---------- */
  function openSheet() {
    var d = $('#sheet');
    var st = status();
    var cn = $('#closedNote');
    cn.hidden = st.open;
    cn.textContent = st.open ? '' : 'Ahora estamos cerrados. ' + st.text.replace(/\.$/, '') + '. Puedes dejarnos tu pedido y te confirmamos apenas abramos.';
    renderSheet();
    if (typeof d.showModal === 'function') { d.showModal(); } else { d.setAttribute('open', ''); }
    document.documentElement.classList.add('lock');
  }
  function closeSheet() {
    var d = $('#sheet');
    if (d.open) { if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }
  }

  /* ---------- Navegación y scrollspy ---------- */
  var sections, chipsEl, navEl, spyTick = false, manualUntil = 0;
  function setNavH() { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); }
  function setActive(id) {
    $$('.chip', chipsEl).forEach(function (ch) {
      var on = ch.getAttribute('data-chip') === id;
      if (on) ch.setAttribute('aria-current', 'true'); else ch.removeAttribute('aria-current');
      if (on) {
        var left = ch.offsetLeft - (chipsEl.clientWidth - ch.offsetWidth) / 2;
        if (Math.abs(chipsEl.scrollLeft - left) > 4) {
          try { chipsEl.scrollTo({ left: left, behavior: behavior() }); } catch (e) { chipsEl.scrollLeft = left; }
        }
      }
    });
  }
  function spy() {
    spyTick = false;
    if (Date.now() < manualUntil) return;
    var off = navEl.offsetHeight + 40, cur = null, vis = sections.filter(function (s) { return !s.hidden; });
    if (!vis.length) return;
    cur = vis[0];
    vis.forEach(function (s) { if (s.getBoundingClientRect().top - off <= 0) cur = s; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = vis[vis.length - 1];
    setActive(cur.id);
    navEl.classList.toggle('stuck', navEl.getBoundingClientRect().top <= 0.5);
  }

  /* ---------- Búsqueda ---------- */
  function search(q) {
    q = norm(q.trim());
    var any = false;
    $('#featured').hidden = !!q;
    sections.forEach(function (s) {
      var n = 0;
      $$('.dish', s).forEach(function (d) { var hit = !q || d.getAttribute('data-search').indexOf(q) !== -1; d.hidden = !hit; if (hit) n++; });
      s.hidden = n === 0;
      var chip = $('[data-chip="' + s.id + '"]'); if (chip) chip.hidden = n === 0;
      if (n) any = true;
    });
    var e = $('#empty');
    e.hidden = any;
    if (!any) e.innerHTML = 'No encontramos «' + esc(q) + '».<br><span>' + esc(C.emptyHint) + '</span>';
    spy();
  }

  /* ---------- Arranque ---------- */
  function init() {
    build();
    navEl = $('.catnav'); chipsEl = $('#chips'); sections = $$('.cat');
    restoreForm();
    refresh();
    setNavH();
    window.addEventListener('resize', setNavH);

    // Fotos: si alguna falla, se reemplaza por una ilustración (nunca imagen rota)
    document.addEventListener('error', function (e) {
      var img = e.target;
      if (!img || img.tagName !== 'IMG' || !img.getAttribute('data-fallback')) return;
      var id = img.getAttribute('data-fallback');
      if (id === 'hero') { img.parentNode.classList.add('hero__img--fallback'); img.remove(); return; }
      var box = img.parentNode, tmp = document.createElement('div');
      tmp.innerHTML = illHTML(ITEMS[id], box.className.replace('ph', '').trim());
      box.replaceWith(tmp.firstChild);
    }, true);

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-add],[data-dec],[data-chip],[data-close],#openCart,#clearCart,#waBtn');
      if (!t) return;
      if (t.hasAttribute('data-add')) {
        var id = t.getAttribute('data-add'), was = cart[id] || 0;
        var box = t.closest('.dish,.feat,.line');
        setQty(id, was + 1);
        if (!was) toast('Agregado: ' + ITEMS[id].name);
        if (box && box.isConnected) { var again = $('[data-add]', box); if (again) again.focus({ preventScroll: true }); }
      } else if (t.hasAttribute('data-dec')) {
        var id2 = t.getAttribute('data-dec'), q2 = (cart[id2] || 0) - 1;
        var holder = t.closest('.dish,.feat,.line');
        setQty(id2, q2);
        if (q2 > 0 && holder && holder.isConnected) { var dec = $('[data-dec]', holder); if (dec) dec.focus(); }
        if (!count()) closeSheet();
      } else if (t.hasAttribute('data-chip')) {
        e.preventDefault();
        var sec = document.getElementById(t.getAttribute('data-chip'));
        manualUntil = Date.now() + (mqReduce.matches ? 50 : 900);
        setActive(sec.id);
        sec.scrollIntoView({ behavior: behavior(), block: 'start' });
      } else if (t.hasAttribute('data-close')) {
        closeSheet();
      } else if (t.id === 'openCart') {
        openSheet();
      } else if (t.id === 'clearCart') {
        cart = {}; store.set(KEY_CART, cart);
        $$('[data-ctl]').forEach(function (el) { el.innerHTML = ctlHTML(el.getAttribute('data-ctl')); });
        refresh(); closeSheet(); toast('Pedido vaciado');
      } else if (t.id === 'waBtn') {
        updateWA();
        if (!validate()) { e.preventDefault(); }
      }
    });

    var sheet = $('#sheet');
    sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
    sheet.addEventListener('close', function () { document.documentElement.classList.remove('lock'); var b = $('#openCart'); if (b && !$('#cartbar').hidden) b.focus(); });
    $('#orderForm').addEventListener('input', function (e) {
      var fld = e.target.closest('.field'); if (fld) fld.classList.remove('bad');
      updateWA();
    });
    $('#orderForm').addEventListener('change', updateWA);
    $('#orderForm').addEventListener('submit', function (e) { e.preventDefault(); });

    $('#q').addEventListener('input', function (e) { search(e.target.value); });

    window.addEventListener('scroll', function () { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });
    window.addEventListener('scrollend', function () { manualUntil = 0; spy(); });
    spy();

    setInterval(function () {
      var st = status(), el = $('#status');
      el.className = 'status ' + (st.open ? 'is-open' : 'is-closed');
      el.querySelector('strong').textContent = st.open ? 'Abierto ahora' : 'Cerrado';
      el.querySelector('.status__txt').textContent = st.text;
      $('#todayHours').textContent = todayHours();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
