.feat{padding:12px 0 12px;border-top:1px dotted color-mix(in srgb,var(--ink) 40%,transparent)}
.feat__name{margin:0;font-style:italic;font-weight:500;font-size:23px;line-height:1.1}
.feat__desc{margin:4px auto 8px;max-width:30ch;font-style:italic;font-size:14px;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.feat__foot{display:flex;align-items:center;justify-content:center;gap:14px}
.feat .price{font-size:19px}
main{padding-bottom:8px}
.cat{padding:30px 18px 6px;scroll-margin-top:calc(var(--navh,47px) - 1px)}
.cat__head{margin:0 0 8px;text-align:center}
.cat__num{display:block;font-size:12px;font-weight:600;letter-spacing:.3em;color:var(--brand)}
.cat__head h2{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-style:italic;font-size:34px;line-height:1}
.cat__head p{margin:8px auto 0;max-width:32ch;font-style:italic;font-size:14.5px;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.cat__head.reveal h2{opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.cat__head.reveal.in h2{opacity:1;transform:none}
.dish{position:relative;min-height:96px;padding:14px 0 12px;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dish__body{display:grid;grid-template-columns:42px 1fr;column-gap:4px}
.dish__num{grid-column:1;grid-row:1/span 4;padding-top:5px;font-size:11px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{grid-column:2;display:flex;gap:10px;margin:-4px 0 1px;padding:0;list-style:none}
.tag{font-family:var(--f-hand);font-size:20px;line-height:1;color:var(--brand);transform:rotate(-2deg)}
.tag::before{content:"✓ "}
.dish__row{grid-column:2;display:flex;align-items:baseline;gap:6px}
.dish__name{position:relative;margin:0;font-weight:600;font-size:18px;line-height:1.22}
.dish__leader{flex:1;min-width:14px;border-bottom:1.5px dotted color-mix(in srgb,var(--ink) 45%,transparent);transform:translateY(-4px)}
.price{font-size:17.5px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-size:12px;font-style:italic;color:var(--muted)}
.dish__desc{grid-column:2;margin:3px 0 0;padding-right:50px;font-style:italic;font-size:14.5px;line-height:1.36;color:color-mix(in srgb,var(--ink) 75%,transparent)}
.dish.en .dish__desc{padding-right:128px}
.dish__foot{position:absolute;right:0;bottom:6px}
.trazo{position:absolute;left:-16px;top:-8px;width:calc(100% + 32px);height:calc(100% + 15px);overflow:visible;pointer-events:none}
.trazo path{fill:none;stroke:var(--pen);stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke;stroke-dasharray:1 2;stroke-dashoffset:1;transition:stroke-dashoffset .7s cubic-bezier(.6,.1,.3,1)}
.trazo{opacity:0}
.dish.en .trazo{opacity:1}
.dish.en .trazo path{stroke-dashoffset:0}
.ctl{display:inline-flex}
.add{display:grid;place-items:center;width:42px;height:42px;padding:0;border:1.5px solid color-mix(in srgb,var(--pen) 55%,transparent);border-radius:50%;background:transparent;color:var(--pen)}
.add svg{width:18px;height:18px;stroke-width:2}
.add span{display:none}
.stepper{display:inline-flex;align-items:center;gap:2px;color:var(--pen)}
.stepper button{display:grid;place-items:center;width:42px;height:42px;padding:0;border:0;background:transparent;color:inherit}
.stepper button svg{width:17px;height:17px;stroke-width:2}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-hand);font-weight:700;font-size:28px;line-height:1;transform:rotate(-8deg)}
.stepper output::before{content:"×"}
.feat .add{width:40px;height:40px}
.empty{margin:30px 24px 10px;text-align:center;font-style:italic;font-size:17px}
.empty span{display:block;margin-top:6px;font-size:14px;color:var(--muted)}
.foot{margin-top:26px;padding:30px 22px 38px;text-align:center;border-top:1px solid var(--ink);box-shadow:inset 0 4px 0 -3px var(--ink)}
body.has-cart .foot{padding-bottom:118px}
.foot p{margin:0 0 8px}
.foot__name{font-family:var(--f-display);font-style:italic;font-size:28px}
.foot__addr,.foot__wa a{display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none;font-style:italic}
.foot__hours{display:flex;justify-content:center;align-items:flex-start;gap:6px;font-size:13px;font-style:italic;max-width:34ch;margin-left:auto!important;margin-right:auto!important;text-align:left}
.foot__hours svg,.foot__addr svg{width:15px;height:15px;margin-top:2px;color:var(--brand)}
.foot__wa a{padding:9px 16px;border:1px solid var(--ink);margin-top:6px;font-style:normal}
.foot__small{font-size:12px;color:var(--muted);margin-top:10px!important}
.credit{margin-top:18px!important;font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:14px 12px 0;pointer-events:none}
.cartbar button{position:relative;pointer-events:auto;width:min(100%,496px);display:flex;align-items:center;gap:12px;min-height:66px;padding:6px 18px calc(8px + env(safe-area-inset-bottom));border:0;border-radius:0;background:var(--sheet-bg);color:var(--ink);box-shadow:0 -10px 30px -10px rgba(60,30,10,.4);text-align:left}
.cartbar button::before{content:"";position:absolute;left:0;right:0;top:-8px;height:9px;background:radial-gradient(circle at 6px 0,transparent 5px,var(--sheet-bg) 5.5px) repeat-x;background-size:12px 9px}
.cartbar__count{order:2;font-family:var(--f-hand);font-weight:700;font-size:26px;color:var(--pen);line-height:1}
.cartbar__count::after{content:" platos";font-size:20px}
.cartbar[data-n="1"] .cartbar__count::after{content:" plato"}
.cartbar__label{order:1;flex:1;font-size:12px;font-weight:600;letter-spacing:.28em;text-transform:uppercase}
.cartbar__total{order:3;font-family:var(--f-hand);font-weight:700;font-size:30px;color:var(--pen);line-height:1;font-variant-numeric:tabular-nums}
.cartbar.pop button{animation:rise .4s cubic-bezier(.2,.9,.3,1.1)}
.cartbar.bump button{animation:bump .3s ease}
@keyframes rise{from{transform:translateY(120%)}to{transform:none}}
@keyframes bump{0%{transform:none}35%{transform:translateY(-5px) rotate(-.6deg)}100%{transform:none}}
.fly1{font-family:var(--f-hand);font-size:24px;color:var(--pen)}
.sheet{border-radius:0;background-image:repeating-linear-gradient(transparent 0 33px,color-mix(in srgb,var(--pen) 12%,transparent) 33px 34px)}
.sheet__head h2{font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
.sheet__grab{display:none}
.line__info strong{font-family:var(--f-hand);font-weight:700;font-size:24px;line-height:1.05;color:var(--pen)}
.line__info span{font-style:italic}
.line__sub{font-family:var(--f-hand);font-weight:700;font-size:24px;color:var(--pen)}
.line .stepper output{font-size:24px}
.sum strong{font-family:var(--f-hand);font-weight:700;font-size:34px;color:var(--pen)}
.form{background:transparent;border:1px dashed color-mix(in srgb,var(--ink) 40%,transparent);border-radius:0}
.form__t{font-size:12px;letter-spacing:.24em;text-transform:uppercase;font-weight:600}
.field input,.field textarea{background:transparent;border:0;border-bottom:1.5px solid color-mix(in srgb,var(--ink) 45%,transparent);border-radius:0;padding-left:2px;font-family:var(--f-hand);font-size:24px;color:var(--pen)}
.field input::placeholder,.field textarea::placeholder{font-family:var(--f-body);font-style:italic;font-size:15px}
.seg span{border-radius:0;background:transparent}
.wa-btn{border-radius:3px;transform:rotate(-.6deg)}
.wa-btn b{font-family:var(--f-hand);font-size:22px}
@media (max-width:359px){.dish__body{grid-template-columns:36px 1fr}.dish__name{font-size:17px}}

  function lines() {

  }
  function total() { return lines().reduce(function (s, l) { return s + l.it.price * l.q; }, 0); }
  function count() { return lines().reduce(function (s, l) { return s + l.q; }, 0); }

  }

    el.style.left = (br.left + br.width / 2) + 'px';

    el.style.setProperty('--dx', Math.round(tr.left + tr.width / 2 - (br.left + br.width / 2)) + 'px');
    el.style.setProperty('--dy', Math.round(tr.top + tr.height / 2 - (br.top + br.height / 2)) + 'px');
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 700);

  /* ---------- Formulario y WhatsApp ---------- */
  function formData() {
    var modo = ($('input[name="modo"]:checked') || {}).value || 'delivery';
    var pago = ($('input[name="pago"]:checked') || {}).value || PAYMENTS[0];
    return {
      nombre: $('#fName').value.trim(), modo: modo, direccion: $('#fAddr').value.trim(),
      pago: pago, efectivo: $('#fCash').value.trim(), nota: $('#fNote').value.trim()
    };
  }
  function waText() {
    var f = formData(), L = [];
    L.push('*Nuevo pedido · ' + C.name + '*');
    L.push('');
    lines().forEach(function (l) { L.push('• ' + l.q + ' × ' + l.it.name + ' — ' + fmt(l.it.price * l.q)); });
    L.push('');
    L.push('*Total productos: ' + fmt(total()) + '*');
    if (f.modo === 'delivery') L.push('_(+ delivery según zona: ' + C.deliveryFee + ')_');
    L.push('');
    L.push('👤 Nombre: ' + (f.nombre || '—'));
    L.push((f.modo === 'delivery' ? '🛵 Entrega: Delivery' : '🛍️ Entrega: Recojo en local'));
    if (f.modo === 'delivery') L.push('📍 Dirección: ' + (f.direccion || '—'));
    L.push('💳 Pago: ' + f.pago + (f.pago === 'Efectivo' && f.efectivo ? ' (pago con ' + CURRENCY + ' ' + f.efectivo.replace(/^\D+/, '') + ')' : ''));
    if (f.nota) L.push('📝 Nota: ' + f.nota);
    return L.join('\n');

    $('#addrField').hidden = f.modo !== 'delivery';
    $('#cashField').hidden = f.pago !== 'Efectivo';
    $('#sumNote').textContent = f.modo === 'delivery' ? 'Delivery: ' + C.deliveryFee + '. Se confirma por WhatsApp.' : 'Recojo en ' + C.address + '.';
    $('#waBtn').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waText());
    store.set(KEY_FORM, f);
  }
  function validate() {
    var f = formData(), ok = true, first = null;
    var nameBad = !f.nombre, addrBad = f.modo === 'delivery' && f.direccion.length < 5;
    $('#fName').closest('.field').classList.toggle('bad', nameBad);
    $('#fAddr').closest('.field').classList.toggle('bad', addrBad);
    $('#fName').setAttribute('aria-invalid', nameBad);
    $('#fAddr').setAttribute('aria-invalid', addrBad);
    if (nameBad) { ok = false; first = $('#fName'); }
    if (addrBad) { ok = false; first = first || $('#fAddr'); }
    if (!lines().length) ok = false;
    if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: behavior() }); }
    return ok;
  }
  function restoreForm() {
    var f = store.get(KEY_FORM, null); if (!f) return;
    $('#fName').value = f.nombre || ''; $('#fAddr').value = f.direccion || '';
    $('#fCash').value = f.efectivo || ''; $('#fNote').value = f.nota || '';
    var m = $('input[name="modo"][value="' + f.modo + '"]'); if (m) m.checked = true;
    var p = $('input[name="pago"][value="' + f.pago + '"]'); if (p) p.checked = true;
  }

  /* ---------- Hoja del pedido ---------- */
  function openSheet() {
    var d = $('#sheet');
    var st = status();
    var cn = $('#closedNote');
    cn.hidden = st.open;
    cn.textContent = st.open ? '' : 'Ahora estamos cerrados. ' + st.text.replace(/\.$/, '') + '. Puedes dejarnos tu pedido y te confirmamos apenas abramos.';
    renderSheet();
    if (typeof d.showModal === 'function') { d.showModal(); } else { d.setAttribute('open', ''); }
    document.documentElement.classList.add('lock');
  }
  function closeSheet() {
    var d = $('#sheet');
    if (d.open) { if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }
  }

  /* ---------- Navegación y scrollspy ---------- */
  var sections, chipsEl, navEl, spyTick = false, manualUntil = 0;
  function setNavH() { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); }
  function setActive(id) {
    $$('.chip', chipsEl).forEach(function (ch) {
      var on = ch.getAttribute('data-chip') === id;
      if (on) ch.setAttribute('aria-current', 'true'); else ch.removeAttribute('aria-current');
      if (on) {
        var left = ch.offsetLeft - (chipsEl.clientWidth - ch.offsetWidth) / 2;
        if (Math.abs(chipsEl.scrollLeft - left) > 4) {
          try { chipsEl.scrollTo({ left: left, behavior: behavior() }); } catch (e) { chipsEl.scrollLeft = left; }
        }
      }
    });
  }
  function spy() {
    spyTick = false;
    if (Date.now() < manualUntil) return;
    var off = (E === 'nocturna' ? 0 : navEl.offsetHeight) + 40, cur = null, vis = sections.filter(function (s) { return !s.hidden; });
    if (!vis.length) return;
    cur = vis[0];
    vis.forEach(function (s) { if (s.getBoundingClientRect().top - off <= 0) cur = s; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = vis[vis.length - 1];
    setActive(cur.id);
    navEl.classList.toggle('stuck', navEl.getBoundingClientRect().top <= 0.5);
  }

  /* ---------- Búsqueda ---------- */
  function search(q) {
    q = norm(q.trim());
    var any = false;
    $('#featured').hidden = !!q;
    sections.forEach(function (s) {
      if (s.id === 'arma') { s.hidden = !!q; $$('[data-chip="arma"]').forEach(function (ca) { ca.hidden = !!q; }); return; }
      var n = 0;
      $$('.dish', s).forEach(function (d) { var hit = !q || d.getAttribute('data-search').indexOf(q) !== -1; d.hidden = !hit; if (hit) n++; });
      s.hidden = n === 0;
      $$('[data-chip="' + s.id + '"]').forEach(function (chip) { chip.hidden = n === 0; });
      if (n) any = true;
    });
    var e = $('#empty');
    e.hidden = any;
    if (!any) e.innerHTML = 'No encontramos «' + esc(q) + '».<br><span>' + esc(C.emptyHint) + '</span>';
    spy();
  }

  /* ---------- Arranque ---------- */
  function init() {
    build();
    navEl = $('.catnav'); chipsEl = $('#chips'); sections = $$('.cat');
    restoreForm();
    if (C.armador) armaInit();
    refresh();
    setNavH();
    window.addEventListener('resize', setNavH);

    // Título de cada sección: el adorno se dibuja al entrar en pantalla (con soporte y sin reduced-motion)
    if (!mqReduce.matches && 'IntersectionObserver' in window) {
      $$('.cat__head').forEach(function (h) { h.classList.add('reveal'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.15 });
      $$('.cat__head.reveal').forEach(function (h) { io.observe(h); });
    }

    // Fotos: si alguna falla, se reemplaza por una ilustración (nunca imagen rota)
    document.addEventListener('error', function (e) {
      var img = e.target;
      if (!img || img.tagName !== 'IMG' || !img.getAttribute('data-fallback')) return;
      var id = img.getAttribute('data-fallback');
      if (id === 'hero') { img.parentNode.classList.add('hero__img--fallback'); img.remove(); return; }
      var box = img.parentNode, tmp = document.createElement('div');
      tmp.innerHTML = illHTML(ITEMS[id], box.className.replace('ph', '').trim());
      box.replaceWith(tmp.firstChild);
    }, true);

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-add],[data-dec],[data-chip],[data-close],#openCart,#clearCart,#waBtn');
      if (!t && E === 'comanda') { var fila = e.target.closest('.cat .dish'); if (fila && !e.target.closest('button,a')) t = $('[data-add]', fila); }
      if (!t) return;
      if (t.hasAttribute('data-add')) {
        var id = t.getAttribute('data-add'), was = cart[id] || 0;
        var box = t.closest('.dish,.feat,.line');
        var barShown = !$('#cartbar').hidden;
        setQty(id, was + 1);
        if (!was) toast('Agregado: ' + ITEMS[id].name);
        var foto = box && box.classList.contains('feat') && ($('.ph .pz', box) || $('.ph img', box));
        if (!(foto && vuela(foto))) { flyPlusOne(t); if (barShown) bumpBar(); }
        if (box && box.isConnected) { var again = $('[data-add]', box); if (again) again.focus({ preventScroll: true }); }
      } else if (t.hasAttribute('data-dec')) {
        var id2 = t.getAttribute('data-dec'), q2 = (cart[id2] || 0) - 1;
        var holder = t.closest('.dish,.feat,.line');
        setQty(id2, q2);
        if (q2 > 0 && holder && holder.isConnected) { var dec = $('[data-dec]', holder); if (dec) dec.focus(); }
        if (!count()) closeSheet();
      } else if (t.hasAttribute('data-chip')) {
        e.preventDefault();
        var sec = document.getElementById(t.getAttribute('data-chip'));
        manualUntil = Date.now() + (mqReduce.matches ? 50 : 900);
        setActive(sec.id);
        sec.scrollIntoView({ behavior: behavior(), block: 'start' });
      } else if (t.hasAttribute('data-close')) {
        closeSheet();
      } else if (t.id === 'openCart') {
        openSheet();
      } else if (t.id === 'clearCart') {
        cart = {}; store.set(KEY_CART, cart);
        $$('[data-ctl]').forEach(function (el) { el.innerHTML = ctlHTML(el.getAttribute('data-ctl')); });
        $$('.dish.en').forEach(function (d) { d.classList.remove('en'); });
        if (C.armador) { Object.keys(CUSTOM).forEach(function (k) { delete ITEMS[k]; }); CUSTOM = {}; store.set(KEY_CUSTOM, CUSTOM); }
        refresh(); closeSheet(); toast('Pedido vaciado');
      } else if (t.id === 'waBtn') {
        updateWA();
        if (!validate()) { e.preventDefault(); }
      }
    });

    var sheet = $('#sheet');
    sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
    sheet.addEventListener('close', function () { document.documentElement.classList.remove('lock'); var b = $('#openCart'); if (b && !$('#cartbar').hidden) b.focus(); });
    $('#orderForm').addEventListener('input', function (e) {
      var fld = e.target.closest('.field'); if (fld) fld.classList.remove('bad');
      updateWA();
    });
    $('#orderForm').addEventListener('change', updateWA);
    $('#orderForm').addEventListener('submit', function (e) { e.preventDefault(); });

    $('#q').addEventListener('input', function (e) { search(e.target.value); });

    window.addEventListener('scroll', function () { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });
    window.addEventListener('scrollend', function () { manualUntil = 0; spy(); });
    spy();

    setInterval(function () {
      var st = status(), el = $('#status');
      el.className = 'status ' + (st.open ? 'is-open' : 'is-closed');
      el.querySelector('strong').textContent = st.open ? 'Abierto ahora' : 'Cerrado';
      el.querySelector('.status__txt').textContent = st.text;
      $('#todayHours').textContent = todayHours();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
