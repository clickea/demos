<style>
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{margin:0;background:var(--page);color:var(--ink);font:400 15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
img{display:block;max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.fill{fill:currentColor;stroke:none}
a{color:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}

.hero{position:relative;isolation:isolate;overflow:hidden;color:var(--hero-ink)}
.hero__img{position:absolute;inset:0;z-index:-2;background:var(--hero-fallback)}
.hero__img img{width:100%;height:100%;object-fit:cover}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--hero-overlay)}
.hero__in{position:relative;min-height:var(--hero-h,318px);display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:28px 18px 26px}
.brand{display:flex;align-items:center;gap:14px}
.brand__emblem{width:72px;height:72px;flex:none;stroke:none}
.brand__kicker{margin:0 0 4px;font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;opacity:.92}
.brand__name{margin:0;font-family:var(--f-display);font-size:34px;line-height:.98;letter-spacing:-.01em}
.hero__tag{margin:2px 0 0;max-width:34ch;font-size:15px;line-height:1.4;opacity:.95}
.status{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin:4px 0 0;padding:7px 12px 7px 10px;border-radius:999px;font-size:13px;background:var(--status-bg);color:var(--status-ink);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.status strong{font-weight:800}
.status__txt{opacity:.85}
.status__dot{width:9px;height:9px;border-radius:50%;background:#2fd06b;box-shadow:0 0 0 0 rgba(47,208,107,.6);animation:pulse 2s infinite}
.status.is-closed .status__dot{background:#ff5a4e;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,208,107,.55)}70%{box-shadow:0 0 0 8px rgba(47,208,107,0)}100%{box-shadow:0 0 0 0 rgba(47,208,107,0)}}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin:0 16px;padding:0;border-radius:var(--r);background:var(--card);box-shadow:var(--card-shadow)}
.fact{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:12px 12px 13px;border-left:1px solid var(--line);min-width:0}
.fact:first-child{border-left:0}

.fact strong{font-size:13px;font-weight:750}

.skip{position:absolute;left:-999px;top:8px;z-index:99;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--bg)}

.foot__hours{display:flex;justify-content:center;align-items:flex-start;gap:6px;font-size:12.5px;opacity:.8;max-width:34ch;margin-left:auto!important;margin-right:auto!important;text-align:left}

.dish--grid .ctl{display:flex}
.search{padding:14px 16px 4px}

.search__box input::placeholder{color:var(--muted);opacity:.85}
.catnav{position:sticky;top:0;z-index:20;background:var(--nav-bg);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);transition:box-shadow .2s}

.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 15px;border-radius:999px;border:1.5px solid var(--chip-line);background:var(--chip-bg);color:var(--chip-ink);font-size:14px;font-weight:650;white-space:nowrap;text-decoration:none;transition:background .2s,color .2s,border-color .2s}
.chip[aria-current="true"]{background:var(--chip-on-bg);color:var(--chip-on-ink);border-color:var(--chip-on-bg)}
main{padding-bottom:8px}
.cat{padding:26px 16px 4px;scroll-margin-top:calc(var(--navh,58px) + 2px)}
.cat__head{margin:0 2px 14px}
.cat__head h2{margin:0;font-family:var(--f-display);font-size:26px;line-height:1.1}
.cat__head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.cat__list{display:grid;gap:12px}
.dish{position:relative;display:grid;grid-template-columns:var(--ph-size,108px) 1fr;gap:13px;padding:12px;background:var(--card);border-radius:var(--r);box-shadow:var(--card-shadow)}
.dish--rowr{grid-template-columns:1fr var(--ph-size,108px)}
.dish--rowr .dish__ph{order:2}
.dish__ph{width:100%;aspect-ratio:1;border-radius:var(--r-ph);overflow:hidden;background:var(--ph-bg)}

.dish__body{display:flex;flex-direction:column;min-width:0}
.dish__name{margin:0 0 3px;font-family:var(--f-name);font-size:16.5px;line-height:1.22;font-weight:var(--w-name,700)}
.dish__desc{margin:0 0 10px;color:var(--muted);font-size:13.5px;line-height:1.42}
.dish__foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dish--big{display:block;padding:0;overflow:hidden}
.dish--big .dish__ph{aspect-ratio:16/10;border-radius:0}
.dish--big .dish__body{padding:14px 16px 16px}
.dish--big .dish__name{font-size:19px}
.cat__list--grid{grid-template-columns:1fr 1fr}
.dish--grid{display:flex;flex-direction:column;padding:0;overflow:hidden;gap:0}
.dish--grid .dish__ph{aspect-ratio:1;border-radius:0}
.dish--grid .dish__body{flex:1;padding:10px 11px 11px}
.dish--grid .dish__name{font-size:15px}
.dish--grid .dish__desc{font-size:12.5px;margin-bottom:8px}
.dish--grid .dish__foot{flex-direction:column;align-items:stretch;gap:8px}
.dish--grid .add,.dish--grid .stepper{width:100%;justify-content:center}
.dish--grid .stepper{justify-content:space-between}
.dish--grid .tags{position:absolute;top:8px;left:8px;margin:0}
.price{font-weight:800;font-size:17px;color:var(--price);white-space:nowrap;font-variant-numeric:tabular-nums}
.price small{font-size:11px;font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 7px;padding:0;list-style:none}
.tag{font-size:11px;font-weight:750;line-height:1;padding:5px 8px;border-radius:999px;background:var(--tag-bg);color:var(--tag-ink);white-space:nowrap}
.tag--top{background:var(--tag-top-bg);color:var(--tag-top-ink)}
.tag--spicy{background:var(--tag-spicy-bg);color:var(--tag-spicy-ink)}
.tag--new{background:var(--tag-new-bg);color:var(--tag-new-ink)}
.ctl{display:inline-flex}
.add{display:inline-flex;align-items:center;gap:5px;height:40px;padding:0 15px 0 11px;border:0;border-radius:999px;background:var(--btn-bg);color:var(--btn-ink);font-weight:750;font-size:14px;transition:transform .12s,filter .2s}
.add svg{width:18px;height:18px;stroke-width:2.4}
.add:active{transform:scale(.96)}
.stepper{display:inline-flex;align-items:center;height:40px;border-radius:999px;background:var(--step-bg);color:var(--step-ink)}
.stepper button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:inherit}
.stepper button svg{width:18px;height:18px;stroke-width:2.4}
.stepper output{min-width:20px;text-align:center;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.ill{position:relative;display:grid;place-items:center;padding-bottom:22%;background:var(--ill-bg);color:var(--ill-ink)}
.ill svg{width:54%;height:auto;stroke-width:2.4}
.ill svg .liq{fill:var(--ill);stroke:none}
.ill__word{position:absolute;left:6px;right:6px;bottom:9%;text-align:center;font-family:var(--f-display);font-size:12px;line-height:1.12;font-weight:700;color:var(--ill-word,var(--ill-ink))}
.feat__ph.ill svg{width:40%}
.feat__ph.ill .ill__word{font-size:16px}
.dish--grid .ill__word{font-size:15px}
.dish--big .ill__word{font-size:15px;bottom:14px}
.featured{padding:22px 0 0}
.featured__head{padding:0 18px 10px}
.featured__head h2{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.1}
.featured__head p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 14px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.feat{flex:0 0 min(64%,250px);scroll-snap-align:start;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;background:var(--card);box-shadow:var(--card-shadow)}
.feat__ph{aspect-ratio:4/3;overflow:hidden;background:var(--ph-bg)}
.feat__body{display:flex;flex-direction:column;gap:8px;flex:1;padding:11px 12px 12px}
.feat__name{margin:0;font-family:var(--f-name);font-size:15px;line-height:1.25;font-weight:var(--w-name,700)}
.feat__foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:6px}
.feat .price{font-size:15.5px}
.feat .add{height:36px;padding:0 12px 0 9px;font-size:13px}
.feat .add span{display:none}
.feat .add{width:36px;padding:0;justify-content:center}
.feat .stepper{height:36px}
.feat .stepper button{width:34px;height:36px}
.empty{margin:30px 24px 10px;text-align:center;font-size:16px;font-weight:700}
.empty span{display:block;margin-top:6px;font-weight:400;font-size:14px;color:var(--muted)}
.foot{margin-top:26px;padding:30px 20px 36px;text-align:center;background:var(--foot-bg);color:var(--foot-ink)}
body.has-cart .foot{padding-bottom:112px}
.foot p{margin:0 0 8px}
.foot__name{font-family:var(--f-display);font-size:22px}
.foot__addr,.foot__wa a{display:inline-flex;align-items:center;gap:6px;font-size:14px;opacity:.9;text-decoration:none}
.foot__wa a{padding:8px 14px;border-radius:999px;border:1px solid currentColor;margin-top:4px}
.foot__small{font-size:12px;opacity:.7;margin-top:10px!important}
.credit{margin-top:18px!important;font-size:11.5px;letter-spacing:.04em;opacity:.55}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;padding:10px 12px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.cartbar button{pointer-events:auto;width:min(100%,496px);display:flex;align-items:center;gap:12px;min-height:58px;padding:0 10px 0 10px;border:0;border-radius:var(--r-bar);background:var(--bar-bg);color:var(--bar-ink);box-shadow:0 14px 34px -10px rgba(0,0,0,.45);font-weight:750;font-size:15.5px;text-align:left}
.cartbar__count{display:grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:12px;background:var(--bar-count-bg);color:var(--bar-count-ink);font-weight:800}
.cartbar__label{flex:1}
.cartbar__total{padding:9px 13px;border-radius:12px;background:var(--bar-total-bg);color:var(--bar-total-ink);font-weight:800;font-variant-numeric:tabular-nums}
.cartbar.pop button{animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(120%)}to{transform:none}}
.toast{position:fixed;left:50%;bottom:92px;z-index:40;max-width:calc(100% - 40px);transform:translate(-50%,20px);padding:10px 16px;border-radius:999px;background:var(--toast-bg);color:var(--toast-ink);font-size:13.5px;font-weight:650;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
body:not(.has-cart) .toast{bottom:24px}
.sheet{width:min(100%,520px);max-width:100%;max-height:92vh;max-height:92dvh;margin:auto auto 0;padding:0;border:0;border-radius:24px 24px 0 0;background:var(--sheet-bg);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.sheet[open]{animation:sheetIn .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetIn{from{transform:translateY(40%);opacity:.4}to{transform:none;opacity:1}}
.sheet::backdrop{background:rgba(10,6,4,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet__in{padding:8px 18px calc(22px + env(safe-area-inset-bottom))}
.sheet__grab{width:44px;height:5px;margin:2px auto 8px;border-radius:9px;background:var(--line)}
.sheet__head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sheet__head h2{margin:0;font-family:var(--f-display);font-size:24px}
.icon-btn{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:50%;background:var(--surface-2);color:var(--ink)}
.sheet__closed{margin:6px 0 10px;padding:10px 12px;border-radius:12px;background:var(--warn-bg);color:var(--warn-ink);font-size:13.5px}
.lines{list-style:none;margin:0;padding:0}
.line{display:grid;grid-template-columns:1fr auto;grid-template-areas:"info sub" "ctl ctl";gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
.line__info{grid-area:info;display:flex;flex-direction:column;min-width:0}
.line__info strong{font-size:15px;line-height:1.25}
.line__info span{font-size:12.5px;color:var(--muted)}
.line .ctl{grid-area:ctl}
.line__sub{grid-area:sub;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.line .stepper{height:36px}
.line .stepper button{width:36px;height:36px}
.line--empty{display:block;color:var(--muted);text-align:center;padding:24px 0}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 2px;font-size:15px}
.sum strong{font-size:21px;font-variant-numeric:tabular-nums;color:var(--price)}
.sum__note{margin:2px 0 8px;font-size:12.5px;color:var(--muted)}
.form{display:grid;gap:14px;margin:14px 0 18px;padding:16px;border-radius:18px;background:var(--surface-2)}
.form__t{margin:0;font-size:15px;font-weight:800}
.field{display:grid;gap:6px;font-size:13.5px;font-weight:650}
.field small{font-weight:400;color:var(--muted)}
.field input,.field textarea{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1.5px solid var(--input-line);background:var(--input-bg);color:var(--ink);font-size:16px;font-weight:400;resize:vertical}
.field input:focus,.field textarea:focus{outline:0;border-color:var(--brand)}
.err{display:none;font-style:normal;font-size:12.5px;font-weight:600;color:var(--danger)}
.field.bad input,.field.bad textarea{border-color:var(--danger)}
.field.bad .err{display:block}
.seg{margin:0;padding:0;border:0;min-width:0}
.seg legend{padding:0;margin-bottom:6px;font-size:13.5px;font-weight:650}
.seg__opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg__opts--3{grid-template-columns:repeat(3,1fr)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;padding:0 8px;border-radius:12px;border:1.5px solid var(--input-line);background:var(--input-bg);font-weight:700;font-size:14px;transition:all .15s}
.seg span svg{width:18px;height:18px}
.seg input:checked+span{border-color:var(--brand);background:var(--seg-on-bg);color:var(--seg-on-ink)}

  /* ---------- Horario (hora de Lima) ---------- */
  var toMin = function (s) { var p = s.split(':'); return (+p[0]) * 60 + (+p[1]); };
  function intervals(day) {
    return (C.hours[day] || []).map(function (r) { var a = toMin(r[0]), b = toMin(r[1]); if (b <= a) b += 1440; return [a, b]; });
  }
  function limaNow() {
    var parts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Lima', weekday: 'short', hour: 'numeric', minute: 'numeric', hourCycle: 'h23' }).formatToParts(new Date());
    var g = function (t) { for (var i = 0; i < parts.length; i++) if (parts[i].type === t) return parts[i].value; return '0'; };
    var h = +g('hour'); if (h === 24) h = 0;
    return { wd: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(g('weekday')), min: h * 60 + (+g('minute')) };
  }
  function hhmm(m) {
    m = m % 1440; var h = Math.floor(m / 60), mm = m % 60;
    var suf = h < 12 ? 'a. m.' : 'p. m.';
    var h12 = h % 12 || 12;
    return h12 + ':' + (mm < 10 ? '0' : '') + mm + ' ' + suf;
  }
  var DAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
  function status() {
    var n = limaNow();
    var today = intervals(n.wd), i, iv;
    for (i = 0; i < today.length; i++) { iv = today[i]; if (n.min >= iv[0] && n.min < iv[1]) return { open: true, text: 'Cierra a las ' + hhmm(iv[1]) }; }
    var yest = intervals((n.wd + 6) % 7);
    for (i = 0; i < yest.length; i++) { iv = yest[i]; if (n.min + 1440 >= iv[0] && n.min + 1440 < iv[1]) return { open: true, text: 'Cierra a las ' + hhmm(iv[1]) }; }
    for (var d = 0; d < 8; d++) {
      var list = intervals((n.wd + d) % 7);
      for (i = 0; i < list.length; i++) {
        if (d > 0 || list[i][0] > n.min) {
          var when = d === 0 ? 'hoy' : d === 1 ? 'mañana' : 'el ' + DAYS[(n.wd + d) % 7];
          return { open: false, text: 'Abre ' + when + ' a las ' + hhmm(list[i][0]) };
        }
      }
    }
    return { open: false, text: '' };
  }

  function todayHours() {
    var list = intervals(limaNow().wd);
    if (!list.length) return 'Cerrado';
    return list.map(function (iv) { return hhmm(iv[0]).replace(':00', '') + ' – ' + (iv[1] % 1440 === 0 ? '12 medianoche' : hhmm(iv[1]).replace(':00', '')); }).join(' / ');
  }

  /* ---------- Carrito ---------- */
  function lines() {
    return Object.keys(cart).map(function (id) { return { it: ITEMS[id], q: cart[id] }; })
      .sort(function (a, b) { return a.it.n - b.it.n; });
  }
  function total() { return lines().reduce(function (s, l) { return s + l.it.price * l.q; }, 0); }
  function count() { return lines().reduce(function (s, l) { return s + l.q; }, 0); }

  var toastT;
  function toast(msg) {
    var t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 1800);
  }
  function setQty(id, q) {
    if (q > 0) cart[id] = Math.min(q, 50); else delete cart[id];
    store.set(KEY_CART, cart);
    $$('[data-ctl="' + id + '"]').forEach(function (el) { el.innerHTML = ctlHTML(id); });
    refresh();
  }
  function refresh() {
    var c = count(), t = total();
    var bar = $('#cartbar');
    var wasHidden = bar.hidden;
    bar.hidden = c === 0;
    document.body.classList.toggle('has-cart', c > 0);
    if (wasHidden && c > 0) { bar.classList.remove('pop'); void bar.offsetWidth; bar.classList.add('pop'); }
    $('#barCount').textContent = c;
    $('#barTotal').textContent = fmt(t);
    $('#openCart').setAttribute('aria-label', 'Ver mi pedido: ' + c + (c === 1 ? ' producto' : ' productos') + ', total ' + fmt(t));
    renderSheet();
  }
  function renderSheet() {
    var ls = lines();
    $('#lines').innerHTML = ls.length ? ls.map(function (l) {
      return '<li class="line"><div class="line__info"><strong>' + esc(l.it.name) + '</strong><span>' + fmt(l.it.price) + ' c/u</span></div>' +
        '<span class="ctl" data-ctl="' + l.it.id + '">' + ctlHTML(l.it.id) + '</span>' +
        '<span class="line__sub">' + fmt(l.it.price * l.q) + '</span></li>';
    }).join('') : '<li class="line line--empty">Tu pedido está vacío. ¡Agrega algo rico!</li>';
    $('#sumTotal').textContent = fmt(total());
    $('#waTotal').textContent = fmt(total());
    updateWA();
  }

  /* ---------- Formulario y WhatsApp ---------- */
  function formData() {
    var modo = ($('input[name="modo"]:checked') || {}).value || 'delivery';
    var pago = ($('input[name="pago"]:checked') || {}).value || PAYMENTS[0];
    return {
      nombre: $('#fName').value.trim(), modo: modo, direccion: $('#fAddr').value.trim(),
      pago: pago, efectivo: $('#fCash').value.trim(), nota: $('#fNote').value.trim()
    };
  }
  function waText() {
    var f = formData(), L = [];
    L.push('*Nuevo pedido · ' + C.name + '*');
    L.push('');
    lines().forEach(function (l) { L.push('• ' + l.q + ' × ' + l.it.name + ' — ' + fmt(l.it.price * l.q)); });
    L.push('');
    L.push('*Total productos: ' + fmt(total()) + '*');
    if (f.modo === 'delivery') L.push('_(+ delivery según zona: ' + C.deliveryFee + ')_');
    L.push('');
    L.push('👤 Nombre: ' + (f.nombre || '—'));
    L.push((f.modo === 'delivery' ? '🛵 Entrega: Delivery' : '🛍️ Entrega: Recojo en local'));
    if (f.modo === 'delivery') L.push('📍 Dirección: ' + (f.direccion || '—'));
    L.push('💳 Pago: ' + f.pago + (f.pago === 'Efectivo' && f.efectivo ? ' (pago con ' + CURRENCY + ' ' + f.efectivo.replace(/^\D+/, '') + ')' : ''));
    if (f.nota) L.push('📝 Nota: ' + f.nota);
    return L.join('\n');
  }
  function updateWA() {
    var f = formData();
    $('#addrField').hidden = f.modo !== 'delivery';
    $('#cashField').hidden = f.pago !== 'Efectivo';
    $('#sumNote').textContent = f.modo === 'delivery' ? 'Delivery: ' + C.deliveryFee + '. Se confirma por WhatsApp.' : 'Recojo en ' + C.address + '.';
    $('#waBtn').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waText());
    store.set(KEY_FORM, f);
  }
  function validate() {
    var f = formData(), ok = true, first = null;
    var nameBad = !f.nombre, addrBad = f.modo === 'delivery' && f.direccion.length < 5;
    $('#fName').closest('.field').classList.toggle('bad', nameBad);
    $('#fAddr').closest('.field').classList.toggle('bad', addrBad);
    $('#fName').setAttribute('aria-invalid', nameBad);
    $('#fAddr').setAttribute('aria-invalid', addrBad);
    if (nameBad) { ok = false; first = $('#fName'); }
    if (addrBad) { ok = false; first = first || $('#fAddr'); }
    if (!lines().length) ok = false;
    if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: behavior() }); }
    return ok;
  }
  function restoreForm() {
    var f = store.get(KEY_FORM, null); if (!f) return;
    $('#fName').value = f.nombre || ''; $('#fAddr').value = f.direccion || '';
    $('#fCash').value = f.efectivo || ''; $('#fNote').value = f.nota || '';
    var m = $('input[name="modo"][value="' + f.modo + '"]'); if (m) m.checked = true;
    var p = $('input[name="pago"][value="' + f.pago + '"]'); if (p) p.checked = true;
  }

  /* ---------- Hoja del pedido ---------- */
  function openSheet() {
    var d = $('#sheet');
    var st = status();
    var cn = $('#closedNote');
    cn.hidden = st.open;
    cn.textContent = st.open ? '' : 'Ahora estamos cerrados. ' + st.text.replace(/\.$/, '') + '. Puedes dejarnos tu pedido y te confirmamos apenas abramos.';
    renderSheet();
    if (typeof d.showModal === 'function') { d.showModal(); } else { d.setAttribute('open', ''); }
    document.documentElement.classList.add('lock');
  }
  function closeSheet() {
    var d = $('#sheet');
    if (d.open) { if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }
  }

  /* ---------- Navegación y scrollspy ---------- */
  var sections, chipsEl, navEl, spyTick = false, manualUntil = 0;
  function setNavH() { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); }
  function setActive(id) {
    $$('.chip', chipsEl).forEach(function (ch) {
      var on = ch.getAttribute('data-chip') === id;
      if (on) ch.setAttribute('aria-current', 'true'); else ch.removeAttribute('aria-current');
      if (on) {
        var left = ch.offsetLeft - (chipsEl.clientWidth - ch.offsetWidth) / 2;
        if (Math.abs(chipsEl.scrollLeft - left) > 4) {
          try { chipsEl.scrollTo({ left: left, behavior: behavior() }); } catch (e) { chipsEl.scrollLeft = left; }
        }
      }
    });
  }
  function spy() {
    spyTick = false;
    if (Date.now() < manualUntil) return;
    var off = navEl.offsetHeight + 40, cur = null, vis = sections.filter(function (s) { return !s.hidden; });
    if (!vis.length) return;
    cur = vis[0];
    vis.forEach(function (s) { if (s.getBoundingClientRect().top - off <= 0) cur = s; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = vis[vis.length - 1];
    setActive(cur.id);
    navEl.classList.toggle('stuck', navEl.getBoundingClientRect().top <= 0.5);
  }

  /* ---------- Búsqueda ---------- */
  function search(q) {
    q = norm(q.trim());
    var any = false;
    $('#featured').hidden = !!q;
    sections.forEach(function (s) {
      var n = 0;
      $$('.dish', s).forEach(function (d) { var hit = !q || d.getAttribute('data-search').indexOf(q) !== -1; d.hidden = !hit; if (hit) n++; });
      s.hidden = n === 0;
      var chip = $('[data-chip="' + s.id + '"]'); if (chip) chip.hidden = n === 0;
      if (n) any = true;
    });
    var e = $('#empty');
    e.hidden = any;
    if (!any) e.innerHTML = 'No encontramos «' + esc(q) + '».<br><span>' + esc(C.emptyHint) + '</span>';
    spy();
  }

  /* ---------- Arranque ---------- */
  function init() {
    build();
    navEl = $('.catnav'); chipsEl = $('#chips'); sections = $$('.cat');
    restoreForm();
    refresh();
    setNavH();
    window.addEventListener('resize', setNavH);

    // Fotos: si alguna falla, se reemplaza por una ilustración (nunca imagen rota)
    document.addEventListener('error', function (e) {
      var img = e.target;
      if (!img || img.tagName !== 'IMG' || !img.getAttribute('data-fallback')) return;
      var id = img.getAttribute('data-fallback');
      if (id === 'hero') { img.parentNode.classList.add('hero__img--fallback'); img.remove(); return; }
      var box = img.parentNode, tmp = document.createElement('div');
      tmp.innerHTML = illHTML(ITEMS[id], box.className.replace('ph', '').trim());
      box.replaceWith(tmp.firstChild);
    }, true);

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-add],[data-dec],[data-chip],[data-close],#openCart,#clearCart,#waBtn');
      if (!t) return;
      if (t.hasAttribute('data-add')) {
        var id = t.getAttribute('data-add'), was = cart[id] || 0;
        var box = t.closest('.dish,.feat,.line');
        setQty(id, was + 1);
        if (!was) toast('Agregado: ' + ITEMS[id].name);
        if (box && box.isConnected) { var again = $('[data-add]', box); if (again) again.focus({ preventScroll: true }); }
      } else if (t.hasAttribute('data-dec')) {
        var id2 = t.getAttribute('data-dec'), q2 = (cart[id2] || 0) - 1;
        var holder = t.closest('.dish,.feat,.line');
        setQty(id2, q2);
        if (q2 > 0 && holder && holder.isConnected) { var dec = $('[data-dec]', holder); if (dec) dec.focus(); }
        if (!count()) closeSheet();
      } else if (t.hasAttribute('data-chip')) {
        e.preventDefault();
        var sec = document.getElementById(t.getAttribute('data-chip'));
        manualUntil = Date.now() + (mqReduce.matches ? 50 : 900);
        setActive(sec.id);
        sec.scrollIntoView({ behavior: behavior(), block: 'start' });
      } else if (t.hasAttribute('data-close')) {
        closeSheet();
      } else if (t.id === 'openCart') {
        openSheet();
      } else if (t.id === 'clearCart') {
        cart = {}; store.set(KEY_CART, cart);
        $$('[data-ctl]').forEach(function (el) { el.innerHTML = ctlHTML(el.getAttribute('data-ctl')); });
        refresh(); closeSheet(); toast('Pedido vaciado');
      } else if (t.id === 'waBtn') {
        updateWA();
        if (!validate()) { e.preventDefault(); }
      }
    });

    var sheet = $('#sheet');
    sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
    sheet.addEventListener('close', function () { document.documentElement.classList.remove('lock'); var b = $('#openCart'); if (b && !$('#cartbar').hidden) b.focus(); });
    $('#orderForm').addEventListener('input', function (e) {
      var fld = e.target.closest('.field'); if (fld) fld.classList.remove('bad');
      updateWA();
    });
    $('#orderForm').addEventListener('change', updateWA);
    $('#orderForm').addEventListener('submit', function (e) { e.preventDefault(); });

    $('#q').addEventListener('input', function (e) { search(e.target.value); });

    window.addEventListener('scroll', function () { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });
    window.addEventListener('scrollend', function () { manualUntil = 0; spy(); });
    spy();

    setInterval(function () {
      var st = status(), el = $('#status');
      el.className = 'status ' + (st.open ? 'is-open' : 'is-closed');
      el.querySelector('strong').textContent = st.open ? 'Abierto ahora' : 'Cerrado';
      el.querySelector('.status__txt').textContent = st.text;
      $('#todayHours').textContent = todayHours();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
