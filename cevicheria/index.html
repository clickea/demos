    var ls = lines();
    $('#lines').innerHTML = ls.length ? ls.map(function (l) {
      return '<li class="line"><div class="line__info"><strong>' + esc(l.it.name) + '</strong><span>' + fmt(l.it.price) + ' c/u</span></div>' +
        '<span class="ctl" data-ctl="' + l.it.id + '">' + ctlHTML(l.it.id) + '</span>' +
        '<span class="line__sub">' + fmt(l.it.price * l.q) + '</span></li>';
    }).join('') : '<li class="line line--empty">Tu pedido está vacío. ¡Agrega algo rico!</li>';
    $('#sumTotal').textContent = fmt(total());
    $('#waTotal').textContent = fmt(total());
    updateWA();
  }

  /* ---------- Formulario y WhatsApp ---------- */
  function formData() {
    var modo = ($('input[name="modo"]:checked') || {}).value || 'delivery';
    var pago = ($('input[name="pago"]:checked') || {}).value || PAYMENTS[0];
    return {
      nombre: $('#fName').value.trim(), modo: modo, direccion: $('#fAddr').value.trim(),
      pago: pago, efectivo: $('#fCash').value.trim(), nota: $('#fNote').value.trim()
    };
  }
  function waText() {
    var f = formData(), L = [];
    L.push('*Nuevo pedido · ' + C.name + '*');
    L.push('');
    lines().forEach(function (l) { L.push('• ' + l.q + ' × ' + l.it.name + ' — ' + fmt(l.it.price * l.q)); });
    L.push('');
    L.push('*Total productos: ' + fmt(total()) + '*');
    if (f.modo === 'delivery') L.push('_(+ delivery según zona: ' + C.deliveryFee + ')_');
    L.push('');
    L.push('👤 Nombre: ' + (f.nombre || '—'));
    L.push((f.modo === 'delivery' ? '🛵 Entrega: Delivery' : '🛍️ Entrega: Recojo en local'));
    if (f.modo === 'delivery') L.push('📍 Dirección: ' + (f.direccion || '—'));
    L.push('💳 Pago: ' + f.pago + (f.pago === 'Efectivo' && f.efectivo ? ' (pago con ' + CURRENCY + ' ' + f.efectivo.replace(/^\D+/, '') + ')' : ''));
    if (f.nota) L.push('📝 Nota: ' + f.nota);
    return L.join('\n');
  }
  function updateWA() {
    var f = formData();
    $('#addrField').hidden = f.modo !== 'delivery';
    $('#cashField').hidden = f.pago !== 'Efectivo';
    $('#sumNote').textContent = f.modo === 'delivery' ? 'Delivery: ' + C.deliveryFee + '. Se confirma por WhatsApp.' : 'Recojo en ' + C.address + '.';
    $('#waBtn').href = 'https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(waText());
    store.set(KEY_FORM, f);
  }
  function validate() {
    var f = formData(), ok = true, first = null;
    var nameBad = !f.nombre, addrBad = f.modo === 'delivery' && f.direccion.length < 5;
    $('#fName').closest('.field').classList.toggle('bad', nameBad);
    $('#fAddr').closest('.field').classList.toggle('bad', addrBad);
    $('#fName').setAttribute('aria-invalid', nameBad);
    $('#fAddr').setAttribute('aria-invalid', addrBad);
    if (nameBad) { ok = false; first = $('#fName'); }
    if (addrBad) { ok = false; first = first || $('#fAddr'); }
    if (!lines().length) ok = false;
    if (first) { first.focus(); first.scrollIntoView({ block: 'center', behavior: behavior() }); }
    return ok;
  }
  function restoreForm() {
    var f = store.get(KEY_FORM, null); if (!f) return;
    $('#fName').value = f.nombre || ''; $('#fAddr').value = f.direccion || '';
    $('#fCash').value = f.efectivo || ''; $('#fNote').value = f.nota || '';
    var m = $('input[name="modo"][value="' + f.modo + '"]'); if (m) m.checked = true;
    var p = $('input[name="pago"][value="' + f.pago + '"]'); if (p) p.checked = true;
  }

  /* ---------- Hoja del pedido ---------- */
  function openSheet() {
    var d = $('#sheet');
    var st = status();
    var cn = $('#closedNote');
    cn.hidden = st.open;
    cn.textContent = st.open ? '' : 'Ahora estamos cerrados. ' + st.text.replace(/\.$/, '') + '. Puedes dejarnos tu pedido y te confirmamos apenas abramos.';
    renderSheet();
    if (typeof d.showModal === 'function') { d.showModal(); } else { d.setAttribute('open', ''); }
    document.documentElement.classList.add('lock');
  }
  function closeSheet() {
    var d = $('#sheet');
    if (d.open) { if (typeof d.close === 'function') d.close(); else d.removeAttribute('open'); }
  }

  /* ---------- Navegación y scrollspy ---------- */
  var sections, chipsEl, navEl, spyTick = false, manualUntil = 0;
  function setNavH() { document.documentElement.style.setProperty('--navh', navEl.offsetHeight + 'px'); }
  function setActive(id) {
    $$('.chip', chipsEl).forEach(function (ch) {
      var on = ch.getAttribute('data-chip') === id;
      if (on) ch.setAttribute('aria-current', 'true'); else ch.removeAttribute('aria-current');
      if (on) {
        var left = ch.offsetLeft - (chipsEl.clientWidth - ch.offsetWidth) / 2;
        if (Math.abs(chipsEl.scrollLeft - left) > 4) {
          try { chipsEl.scrollTo({ left: left, behavior: behavior() }); } catch (e) { chipsEl.scrollLeft = left; }
        }
      }
    });
  }
  function spy() {
    spyTick = false;
    if (Date.now() < manualUntil) return;
    var off = (E === 'nocturna' ? 0 : navEl.offsetHeight) + 40, cur = null, vis = sections.filter(function (s) { return !s.hidden; });
    if (!vis.length) return;
    cur = vis[0];
    vis.forEach(function (s) { if (s.getBoundingClientRect().top - off <= 0) cur = s; });
    if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = vis[vis.length - 1];
    setActive(cur.id);
    navEl.classList.toggle('stuck', navEl.getBoundingClientRect().top <= 0.5);
  }

  /* ---------- Búsqueda ---------- */
  function search(q) {
    q = norm(q.trim());
    var any = false;
    $('#featured').hidden = !!q;
    sections.forEach(function (s) {
      if (s.id === 'arma') { s.hidden = !!q; $$('[data-chip="arma"]').forEach(function (ca) { ca.hidden = !!q; }); return; }
      var n = 0;
      $$('.dish', s).forEach(function (d) { var hit = !q || d.getAttribute('data-search').indexOf(q) !== -1; d.hidden = !hit; if (hit) n++; });
      s.hidden = n === 0;
      $$('[data-chip="' + s.id + '"]').forEach(function (chip) { chip.hidden = n === 0; });
      if (n) any = true;
    });
    var e = $('#empty');
    e.hidden = any;
    if (!any) e.innerHTML = 'No encontramos «' + esc(q) + '».<br><span>' + esc(C.emptyHint) + '</span>';
    spy();
  }

  /* ---------- Arranque ---------- */
  function init() {
    build();
    navEl = $('.catnav'); chipsEl = $('#chips'); sections = $$('.cat');
    restoreForm();
    if (C.armador) armaInit();
    refresh();
    setNavH();
    window.addEventListener('resize', setNavH);

    // Título de cada sección: el adorno se dibuja al entrar en pantalla (con soporte y sin reduced-motion)
    if (!mqReduce.matches && 'IntersectionObserver' in window) {
      $$('.cat__head').forEach(function (h) { h.classList.add('reveal'); });
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.15 });
      $$('.cat__head.reveal').forEach(function (h) { io.observe(h); });
    }

    // Fotos: si alguna falla, se reemplaza por una ilustración (nunca imagen rota)
    document.addEventListener('error', function (e) {
      var img = e.target;
      if (!img || img.tagName !== 'IMG' || !img.getAttribute('data-fallback')) return;
      var id = img.getAttribute('data-fallback');
      if (id === 'hero') { img.parentNode.classList.add('hero__img--fallback'); img.remove(); return; }
      var box = img.parentNode, tmp = document.createElement('div');
      tmp.innerHTML = illHTML(ITEMS[id], box.className.replace('ph', '').trim());
      box.replaceWith(tmp.firstChild);
    }, true);

    document.addEventListener('click', function (e) {
      var t = e.target.closest('[data-add],[data-dec],[data-chip],[data-close],#openCart,#clearCart,#waBtn');
      if (!t && E === 'comanda') { var fila = e.target.closest('.cat .dish'); if (fila && !e.target.closest('button,a')) t = $('[data-add]', fila); }
      if (!t) return;
      if (t.hasAttribute('data-add')) {
        var id = t.getAttribute('data-add'), was = cart[id] || 0;
        var box = t.closest('.dish,.feat,.line');
        var barShown = !$('#cartbar').hidden;
        setQty(id, was + 1);
        if (!was) toast('Agregado: ' + ITEMS[id].name);
        var foto = box && box.classList.contains('feat') && ($('.ph .pz', box) || $('.ph img', box));
        if (!(foto && vuela(foto))) { flyPlusOne(t); if (barShown) bumpBar(); }
        if (box && box.isConnected) { var again = $('[data-add]', box); if (again) again.focus({ preventScroll: true }); }
      } else if (t.hasAttribute('data-dec')) {
        var id2 = t.getAttribute('data-dec'), q2 = (cart[id2] || 0) - 1;
        var holder = t.closest('.dish,.feat,.line');
        setQty(id2, q2);
        if (q2 > 0 && holder && holder.isConnected) { var dec = $('[data-dec]', holder); if (dec) dec.focus(); }
        if (!count()) closeSheet();
      } else if (t.hasAttribute('data-chip')) {
        e.preventDefault();
        var sec = document.getElementById(t.getAttribute('data-chip'));
        manualUntil = Date.now() + (mqReduce.matches ? 50 : 900);
        setActive(sec.id);
        sec.scrollIntoView({ behavior: behavior(), block: 'start' });
      } else if (t.hasAttribute('data-close')) {
        closeSheet();
      } else if (t.id === 'openCart') {
        openSheet();
      } else if (t.id === 'clearCart') {
        cart = {}; store.set(KEY_CART, cart);
        $$('[data-ctl]').forEach(function (el) { el.innerHTML = ctlHTML(el.getAttribute('data-ctl')); });
        $$('.dish.en').forEach(function (d) { d.classList.remove('en'); });
        if (C.armador) { Object.keys(CUSTOM).forEach(function (k) { delete ITEMS[k]; }); CUSTOM = {}; store.set(KEY_CUSTOM, CUSTOM); }
        refresh(); closeSheet(); toast('Pedido vaciado');
      } else if (t.id === 'waBtn') {
        updateWA();
        if (!validate()) { e.preventDefault(); }
      }
    });

    var sheet = $('#sheet');
    sheet.addEventListener('click', function (e) { if (e.target === sheet) closeSheet(); });
    sheet.addEventListener('close', function () { document.documentElement.classList.remove('lock'); var b = $('#openCart'); if (b && !$('#cartbar').hidden) b.focus(); });
    $('#orderForm').addEventListener('input', function (e) {
      var fld = e.target.closest('.field'); if (fld) fld.classList.remove('bad');
      updateWA();
    });
    $('#orderForm').addEventListener('change', updateWA);
    $('#orderForm').addEventListener('submit', function (e) { e.preventDefault(); });

    $('#q').addEventListener('input', function (e) { search(e.target.value); });

    window.addEventListener('scroll', function () { if (!spyTick) { spyTick = true; requestAnimationFrame(spy); } }, { passive: true });
    window.addEventListener('scrollend', function () { manualUntil = 0; spy(); });
    spy();

    setInterval(function () {
      var st = status(), el = $('#status');
      el.className = 'status ' + (st.open ? 'is-open' : 'is-closed');
      el.querySelector('strong').textContent = st.open ? 'Abierto ahora' : 'Cerrado';
      el.querySelector('.status__txt').textContent = st.text;
      $('#todayHours').textContent = todayHours();
    }, 60000);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
